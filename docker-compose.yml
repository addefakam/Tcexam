version: '3.8'

services:
  tcexam:
    build: .
    ports:
      - "8080:80"
    environment:
      - DATABASE_HOST=db
      - DATABASE_NAME=tcexam
      - DATABASE_USER=tcexam
      - DATABASE_PASSWORD=tcexam_pass
      - DATABASE_TYPE=MYSQL
    depends_on:
      - db
    volumes:
      - .:/var/www/html

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      - MYSQL_DATABASE=tcexam
      - MYSQL_USER=tcexam
      - MYSQL_PASSWORD=tcexam_pass
      - MYSQL_ROOT_PASSWORD=root_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
